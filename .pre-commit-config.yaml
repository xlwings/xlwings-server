# To install this pre-commit hook, run:
#
# pip install pre-commit (or brew install pre-commit)
# pre-commit install
#
# To run changed files manually: pre-commit
# To run all files manually: pre-commit run --all-files
#
# See also: https://pre-commit.com
exclude: |
  (?x)^(
  xlwings_server/static/vendor/.*
  )$

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: local
    hooks:
      # Run the ruff locked in uv.lock and the Prettier in node_modules, so
      # one version applies to the hooks, the editor, and the command line
      - id: ruff-check
        name: ruff check
        entry: uv run --frozen ruff check --force-exclude
        language: system
        types_or: [python, pyi]

      - id: ruff-format
        name: ruff format
        entry: uv run --frozen ruff format --force-exclude
        language: system
        types_or: [python, pyi]

      - id: prettier
        name: prettier
        entry: npx --no-install prettier --write --ignore-unknown
        language: system
        types_or: [html, javascript, css, markdown]
