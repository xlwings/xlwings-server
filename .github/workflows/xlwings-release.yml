name: Release

# Publishes to PyPI when a GitHub release is published. Uses Trusted Publishing (no API
# token) and uploads PEP 740 attestations, so PyPI shows the provenance of each file.
# The actions run at the commits locked in .github/workflows/actions.lock.

on:
  release:
    types: [published]

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'xlwings/xlwings-server'
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0  # Required for hatch-vcs to determine version from git tags

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"
          # No cache in releases to rule out cache poisoning
          enable-cache: false

      - name: Run tests
        env:
          XLWINGS_LICENSE_KEY: ${{ secrets.XLWINGS_LICENSE_KEY }}
        run: |
          uv sync --locked --group all
          uv run pytest

      - name: Build package
        run: uv build

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/xlwings-server/
    permissions:
      id-token: write  # Trusted Publishing and attestations
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@v1.14.3
        with:
          attestations: true
