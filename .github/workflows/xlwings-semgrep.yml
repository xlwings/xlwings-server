on:
  workflow_dispatch: {}
  pull_request: {}
  push:
    branches:
      - main
    paths:
      - .github/workflows/xlwings-semgrep.yml
name: Semgrep
permissions: {}
jobs:
  semgrep:
    if: github.repository == 'xlwings/xlwings-server'
    name: semgrep/ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
    container:
      # Pinned by digest as actions.lock only covers actions: update tag and digest together
      image: semgrep/semgrep:1.185.0@sha256:67518c174185a2043fdbed16c70631b79209499b3671178e7194379b48295a0d
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: semgrep ci
