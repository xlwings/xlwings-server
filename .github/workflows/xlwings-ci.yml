name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - "**"
    tags:
      - "**"

jobs:
  lint:
    if: github.repository == 'xlwings/xlwings-server'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: j178/prek-action@4e14d07f9231acabce116ccfca13b13dd9755ece # v3.0.0

  test:
    if: github.repository == 'xlwings/xlwings-server'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    env:
      XLWINGS_LICENSE_KEY: ${{ secrets.XLWINGS_LICENSE_KEY }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Install dependencies
        run: |
          uv sync --group all

      - name: Run tests with xlwings Server and .env.test
        run: uv run pytest -v

      - name: Run tests with xlwings Server that depend on env.test2 (examples disabled)
        env:
          ENV_FILE: ".env.test2"
        run: uv run pytest tests/test_env2.py

      - name: Run tests with xlwings Wasm
        if: matrix.python-version == '3.12'
        env:
          ENV_FILE: ".env.testwasm"
        run: uv run pytest -v

  test-js:
    if: github.repository == 'xlwings/xlwings-server'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      # --ignore-scripts skips the postinstall hook, which vendors the npm packages into
      # the static folder via uv/Python - not needed to run the JS tests
      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Run JS tests
        run: npm test

  build:
    if: github.repository == 'xlwings/xlwings-server'
    needs: [lint, test, test-js]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Required for hatch-vcs to determine version from git tags

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build package
        run: uv build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: xlwings-server-dist
          path: dist/*
          retention-days: 3
          if-no-files-found: error

  publish:
    if: github.repository == 'xlwings/xlwings-server' && startsWith(github.ref, 'refs/tags/')
    needs: [lint, test]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/xlwings-server/
    permissions:
      id-token: write  # Required for trusted publishing
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Required for hatch-vcs to determine version from git tags

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          # Install a specific version of uv.
          version: "0.9.25"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build package
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
