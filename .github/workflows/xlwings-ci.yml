name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    if: github.repository == 'xlwings/xlwings-server'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: j178/prek-action@v3.0.0

  test:
    if: github.repository == 'xlwings/xlwings-server'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    env:
      XLWINGS_LICENSE_KEY: ${{ secrets.XLWINGS_LICENSE_KEY }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          uv sync --group all

      - name: Run tests with xlwings Server and .env.test
        run: uv run pytest -v

      - name: Run tests with xlwings Server that depend on env.test2 (examples disabled)
        env:
          ENV_FILE: ".env.test2"
        run: uv run pytest tests/test_env2.py

      - name: Run tests with xlwings Wasm
        if: matrix.python-version == '3.12'
        env:
          ENV_FILE: ".env.testwasm"
        run: uv run pytest -v

  test-js:
    if: github.repository == 'xlwings/xlwings-server'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"

      # npm ci installs exactly what's in package-lock.json. --ignore-scripts skips the
      # postinstall hook, which vendors the npm packages into the static folder via
      # uv/Python - not needed to run the JS tests
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run JS tests
        run: npm test

  build:
    if: github.repository == 'xlwings/xlwings-server'
    needs: [lint, test, test-js]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0  # Required for hatch-vcs to determine version from git tags

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"

      - name: Build package
        run: uv build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7.0.2
        with:
          name: xlwings-server-dist
          path: dist/*
          retention-days: 3
          if-no-files-found: error

  lockfile:
    if: github.repository == 'xlwings/xlwings-server'
    name: Verify actions.lock
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install gh-actions-lock
        run: gh extension install github/gh-actions-lock --pin v0.4.1

      # Fails if a workflow uses an action that isn't locked in .github/workflows/actions.lock
      - name: Verify
        run: gh actions-lock --verify
